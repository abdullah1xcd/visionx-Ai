services:
  - type: web
    name: visionx-ai-engine
    runtime: docker
    plan: starter
    dockerfilePath: ./ai_engine/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MODEL_NAME
        value: yolo11s.pt
      - key: POSE_MODEL_NAME
        value: yolo11s-pose.pt
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: ALLOWED_ORIGINS
        value: https://visionx-ai.vercel.app
