name: Python Tracking Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tracking-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Run tracking adapter tests
        run: python -m unittest tests.test_tracking -v
